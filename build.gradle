import org.jetbrains.changelog.Changelog

plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    id 'org.jetbrains.changelog' version '2.2.1'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

changelog {
    version = version
    path = file("CHANGELOG.md").canonicalPath
    groups = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
    lineSeparator = "\n"
}

publishMods {
    type = STABLE
    version = "${project.version}+${minecraft_version}"
    changelog = project(":common").changelog.renderItem(project(":common").changelog
            .getLatest()
            .withHeader(false)
            .withEmptySections(false),
            Changelog.OutputType.MARKDOWN
    )

    def cfOptions = curseforgeOptions {
        projectId = "1061972"
        projectSlug = "unseaworthy" // Required for discord webhook
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        requires("cloth-config")
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        modLoaders.add("fabric")
        requires("cardinal-components-api")
        optional("modmenu")
        file = tasks.getByPath(":fabric:remapJar").outputs.files.singleFile
    }

    curseforge("curseforgeNeoforge") {
        from cfOptions
        modLoaders.add("neoforge")
        file = tasks.findByPath(":neoforge:jar").outputs.files.singleFile
    }

    def mrOptions = modrinthOptions {
        projectId = "9OuwP2Qv"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("cloth-config")
    }
    modrinth("modrinthFabric") {
        from mrOptions
        modLoaders.add("fabric")
        file = tasks.getByPath(":fabric:remapJar").outputs.files.singleFile
        optional("modmenu")
    }

    modrinth("modrinthNeoForge") {
        from mrOptions
        file = tasks.findByPath(":neoforge:jar").outputs.files.singleFile
        modLoaders.add("neoforge")
    }
}
